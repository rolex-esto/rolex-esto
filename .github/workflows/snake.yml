name: Generate profile graphics

on:
  schedule:
    - cron: "17 3 * * *"   # daily; off the top of the hour to avoid GitHub's cron backlog
  workflow_dispatch:
  push:
    branches: [main]

# Least privilege: nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  generate:
    # Third-party actions run here with a READ-ONLY token.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6B54D6&color_dots=#E9E2D4,#C9E6D3,#A8D8B9,#72B08A,#4A9068
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#B8A4FF&color_dots=#232A3B,#3F5C4D,#5F8C72,#84B497,#A8D8B9

      # Real-data stats cards and the Developer Overview panel (account totals,
      # 12-month activity, isometric 3D contribution graph, calendar) from the
      # GraphQL API with the built-in read-only token. Exits non-zero (and writes
      # nothing) on any API or validation failure.
      - name: Generate stats cards and overview panel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate-github-stats.py "${{ github.repository_owner }}" dist

      # Never publish an incomplete or malformed set: a failed check stops the
      # run before the publish job, so the previously published images remain.
      - name: Validate generated images
        run: |
          set -euo pipefail
          for f in github-snake.svg github-snake-dark.svg \
                   stats-activity-dark.svg stats-activity-light.svg \
                   stats-languages-dark.svg stats-languages-light.svg \
                   overview-activity-dark.svg overview-activity-light.svg; do
            test -s "dist/$f" || { echo "::error::missing or empty dist/$f"; exit 1; }
            python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" "dist/$f"
          done
          # The overview must contain a full year of calendar cells and the 3D graph.
          for f in overview-activity-dark.svg overview-activity-light.svg; do
            cells=$(grep -o 'rx="1" fill=' "dist/$f" | wc -l)
            test "$cells" -ge 300 || { echo "::error::$f has only $cells calendar cells"; exit 1; }
            grep -q '<polygon' "dist/$f" || { echo "::error::$f has no isometric graph"; exit 1; }
          done
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-graphics
          path: dist
          retention-days: 3

  publish:
    # Only this job can write, and it runs no third-party code except the deploy action.
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-graphics
          path: dist

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
