name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0EA5E9&color_dots=#EBEDF0,#9BE9C8,#4FD1A5,#00C389,#007A56
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#0EA5E9&color_dots=#161B22,#0B4F3A,#008F68,#00C389,#5CF0C0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
