<title id="t">Rolex J. Esto</title>
<desc id="d">Banner. Rolex J. Esto: Software Engineering, AI, Data Engineering, Cloud. Microsoft Certified DP-700, ISC2 Certified in Cybersecurity, four hackathon top finishes; building BizPilot; BSIT at STI College Fairview. Illustration: an isometric workstation on a circuit board with a monitor, server, database, AI chip, a cloud and a security shield, joined by traces that carry small data packets.</desc>
